# Pages CMS editor (https://pagescms.org). Every save commits to GitHub and republishes the site.
# Photos: upload any size; the site crops them to fit. Use **bold**, *italic* and [link](page.html) in text.

media:
  input: img
  output: img
content:
- name: home
  label: Home page
  type: file
  path: content/home.json
  format: json
  fields:
  - name: hero
    label: Top of page
    type: object
    fields:
    - name: eyebrow
      label: Small heading
      type: string
    - name: title
      label: Main heading
      type: string
    - name: text
      label: Intro text
      type: text
    - name: image
      label: Background photo
      type: image
    - name: imageAlt
      label: Photo description (for screen readers)
      type: string
  - name: about
    label: About section
    type: object
    fields:
    - name: eyebrow
      label: Small heading
      type: string
    - name: title
      label: Heading
      type: string
    - name: text
      label: Text
      type: text
    - name: image
      label: Photo
      type: image
    - name: imageAlt
      label: Photo description
      type: string
  - name: stats
    label: Numbers band
    type: object
    fields:
    - name: eyebrow
      label: Small heading
      type: string
    - name: title
      label: Heading
      type: string
    - name: text
      label: Text
      type: text
    - name: items
      label: Numbers
      type: object
      list: true
      fields:
      - name: number
        label: Number
        type: string
      - name: label
        label: Label
        type: string
  - name: featured
    label: Featured projects heading (tick "Featured" on up to 3 projects)
    type: object
    fields:
    - name: eyebrow
      label: Small heading
      type: string
    - name: title
      label: Heading
      type: string
  - name: mission
    label: Mission quote
    type: object
    fields:
    - name: eyebrow
      label: Small heading
      type: string
    - name: quote
      label: Quote
      type: text
    - name: cite
      label: Source line
      type: string
  - name: affiliations
    label: Affiliations heading (the list itself is under Site settings)
    type: object
    fields:
    - name: eyebrow
      label: Small heading
      type: string
    - name: title
      label: Heading
      type: string
    - name: text
      label: Text
      type: text
  - name: close
    label: Closing band
    type: object
    fields:
    - name: eyebrow
      label: Small heading
      type: string
    - name: title
      label: Heading
      type: string
    - name: big
      label: Large closing words (*word* turns light blue)
      type: string
