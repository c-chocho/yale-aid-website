  - name: name
    label: Short name
    type: string
  - name: fullName
    label: Full name
    type: string
  - name: footerAbout
    label: Footer description
    type: text
  - name: contactEmail
    label: Email that receives messages
    type: string
  - name: yaleConnectUrl
    label: YaleConnect mailing list link
    type: string
  - name: formEndpoint
    label: Form service address (optional, e.g. a Formspree link; empty = open the
      visitor’s email app)
    type: string
  - name: photoCredits
    label: Photo credits (footer)
    type: text
  - name: affiliations
    label: Affiliations (logos)
    type: object
    list: true
    fields:
    - name: name
      label: Name
      type: string
    - name: description
      label: Full name (shown on hover)
      type: string
    - name: url
      label: Website link
      type: string
    - name: logo
      label: Logo (a transparent PNG or SVG works best)
      type: image
