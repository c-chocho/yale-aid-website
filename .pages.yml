    - name: started
      label: Start line (e.g. Started 2022)
      type: string
    - name: image
      label: Photo
      type: image
    - name: imageAlt
      label: Photo description
      type: string
    - name: featured
      label: Featured on the home page
      type: boolean
    - name: lead
      label: Project manager
