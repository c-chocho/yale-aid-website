- name: projects
  label: Projects
  type: file
  path: content/projects.json
  format: json
  fields:
  - name: hero
    label: Top of page
    type: object
    fields:
    - name: eyebrow
      label: Small heading
      type: string
    - name: title
      label: Main heading
      type: string
    - name: text
      label: Intro text
      type: text
    - name: image
      label: Banner photo
      type: image
    - name: imageAlt
      label: Photo description (for screen readers)
      type: string
  - name: currentIntro
    label: Current projects heading
    type: object
    fields:
    - name: eyebrow
      label: Small heading
      type: string
    - name: title
      label: Heading
      type: string
    - name: text
      label: Text
      type: text
  - name: current
    label: Current projects
    type: object
    list: true
    fields:
    - name: name
      label: Project name
      type: string
    - name: category
      label: Filter category
      type: select
      options:
        values:
        - value: rehab
          label: Rehabilitation
        - value: hospital
          label: Hospital care
        - value: prosthetics
          label: Prosthetics
        - value: mobility
          label: Mobility
    - name: tag
      label: Small label above the name
      type: string
    - name: description
      label: Description
      type: text
    - name: stage
      label: Stage (e.g. In design)
      type: string
    - name: partner
      label: Partner line
      type: string
    - name: image
      label: Photo
      type: image
    - name: imageAlt
      label: Photo description
      type: string
    - name: featured
      label: Featured on the home page
      type: boolean
    - name: lead
      label: Project manager
      type: string
    - name: team
      label: Team members
      type: string
    - name: overview
      label: 'Popup: overview'
      type: text
    - name: need
      label: 'Popup: who it’s for'
      type: text
    - name: design
      label: 'Popup: how it works'
      type: text
    - name: status
      label: 'Popup: where it stands'
      type: text
    - name: gallery
      label: 'Popup: more photos'
      type: image
      options:
        multiple: true
  - name: pastIntro
    label: Concluded projects heading
    type: object
    fields:
    - name: eyebrow
